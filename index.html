<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Something Special ❤️</title>

    <link rel="stylesheet" href="css/lock.css">
</head>

<body>

<div class="hearts"></div>

<main class="lock-container">

    <div class="lock-card">

        <div class="lock-icon">🔐</div>

        <h1>Shhh... 🤫</h1>

        <p class="subtitle">
            Something very special is waiting for you. ❤️
        </p>

        <p class="small-text">
            But you're a little early...
        </p>

        <div class="countdown">

            <div class="time-box">
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div class="colon">:</div>

            <div class="time-box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="colon">:</div>

            <div class="time-box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="colon">:</div>

            <div class="time-box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>

        </div>

        <p class="waiting">
            Your surprise will unlock automatically. 💗
        </p>

        <div class="heart">❤️</div>

    </div>

</main>

<script src="js/lock.js"></script>

</body>
</html>
